<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoramento dos Reservatórios</title>

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Biblioteca Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <div class="header-top">
        <div class="header-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <path
                d="M16 3.5c-3.8 5-8.5 10-8.5 16a8.5 8.5 0 0 0 17 0c0-6-4.7-11-8.5-16Z"
              ></path>
              <path d="M11.5 20.5a4.5 4.5 0 0 0 4.5 4.5"></path>
            </svg>
          </span>
          <div class="header-brand-copy">
            <span class="header-eyebrow"
              ><span aria-hidden="true"></span> MONITORAMENTO</span
            >
            <h1>Reservatórios</h1>
            <p class="header-subtitle">Níveis e vazões</p>
          </div>
        </div>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Ativar tema claro"
          aria-pressed="false"
          title="Ativar tema claro"
        >
          <svg
            class="theme-icon theme-icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            ></path>
          </svg>
          <svg
            class="theme-icon theme-icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"
            ></path>
          </svg>
        </button>
      </div>
      <div class="header-controls">
        <div class="control-group">
          <label for="seletor-filtro">Grupo / Reservatório:</label>
          <select id="seletor-filtro"></select>
        </div>
        <div class="control-group">
          <label for="seletor-data">Data:</label>
          <select id="seletor-data"></select>
        </div>
        <div class="meta-info">
          Última Atualização: <span id="lbl-atualizacao">--</span>
        </div>
      </div>
    </header>

    <!-- Grid onde os cards dos reservatórios serão injetados -->
    <main class="dashboard-grid" id="grid-reservatorios"></main>

    <!-- Scripts JavaScript -->
    <script src="dados.js"></script>
    <script src="app.js"></script>
  </body>
</html>
